[package]
name = "gwa-native-runner"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dunce = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml_edit = "0.23"
