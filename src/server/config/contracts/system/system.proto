syntax = "proto3";
package gwa.system;
service Capabilities { rpc Invoke(InvokeRequest) returns (InvokeResult); }
message InvokeRequest { string operation = 1; string payload_json = 2; }
message InvokeResult { string result_json = 1; }
message EnqueueRequest { string operation = 1; string payload_json = 2; }
message EnqueueResult { string job_id = 1; }
message JobRequest { string job_id = 1; }
message JobResult { string job_id = 1; string state = 2; string result_json = 3; string error = 4; }
